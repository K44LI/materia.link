<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- cor da barra do navegador no celular. Para mudar, troque o código da cor. -->
  <meta name="theme-color" content="#0b4a25">
  <meta name="description" content="MatériaLink: conecte pessoas e empresas para vender, doar e encontrar materiais recicláveis.">
  <title>MatériaLink | Favoritos</title>

  <!-- BOOTSTRAP 5 (CSS) — carregado ANTES do nosso style.css, para o nosso CSS poder sobrescrever o que precisar -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- data-page diz ao JavaScript qual tela desenhar (veja js/app.js e o objeto V em js/pages/pages.js) -->
<body data-page="favoritos">
  <!-- link de acessibilidade: aparece só quando se navega com Tab; pula direto para o conteúdo -->
  <a class="visually-hidden-focusable" href="#conteudo">Pular para o conteúdo</a>

  <div class="leaf a" aria-hidden="true"></div>
  <div class="leaf b" aria-hidden="true"></div>
  <div class="leaf c" aria-hidden="true"></div>
  <div class="leaf d" aria-hidden="true"></div>

  <!-- botão de tema claro/escuro (a lógica está em setTheme() no js/core.js) -->
  <button class="tg" id="tg" type="button"
    onclick="setTheme(TH === 'dark' ? 'light' : 'dark')"
    aria-label="Alternar tema claro/escuro"></button>

  <!-- aqui o JavaScript injeta a página (<header>, <nav>, <main>...) -->
  <div id="app"></div>

  <noscript>Ative o JavaScript no navegador para usar o MatériaLink.</noscript>

  <!-- BOOTSTRAP 5 (JS) — necessário para o componente Toast (avisos) usado em toast() no js/core.js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- arquivos do MatériaLink — A ORDEM IMPORTA: cada um usa o que o anterior criou -->
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages/pages.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
